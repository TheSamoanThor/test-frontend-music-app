---
meta:
  environment: python
  toolchain:
    name: pip
    version: 3.11
build:
  requirementsPath: requirements.txt
  useCache: true
run:
  persistenceMount: /data
  command: uvicorn server:app --host 0.0.0.0 --port 80
  containerPort: 80
  russianTrustedCa: false
  singleton: true
  zeroDowntime: false
