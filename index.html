<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player с тегами и очередью</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <header>
            <div class="toolbar">
                <button id="select-music-btn">📂 Выбрать папку с музыкой</button>
                <nav class="main-nav">
                    <button class="nav-btn" data-page="library">📚 Библиотека</button>
                    <button class="nav-btn" data-page="queue">⏯️ Очередь</button>
                    <button class="nav-btn" data-page="settings">⚙️ Настройки</button>
                </nav>
                <button id="import-btn">📥 Импорт</button>
                <button id="export-btn">📤 Экспорт</button>
                <select id="theme-select">
                    <option value="light">☀️ Светлая</option>
                    <option value="dark">🌙 Тёмная</option>
                    <option value="dark2">🌙 Тёмная 2</option>
                    <option value="light-blue">💧 Светло-синяя</option>
                    <option value="dark-purple">🟣 Тёмно-фиолетовая</option>
                    <option value="green">🍃 Зелёная</option>
                    <option value="orange">🍊 Оранжевая</option>
                    <option value="monochrome">⚫ Монохромная</option>
                </select>
                <input type="color" id="custom-color" value="#4a90e2" title="Основной цвет">
            </div>
        </header>

        <main>
            <!-- Страница библиотеки -->
            <div class="page" id="page-library">
                <h2>📚 Библиотека</h2>
                <div class="filter-bar">
                    <input type="text" id="tag-filter" placeholder="Фильтр по тегам (рок, поп, ...)">
                    <button id="apply-filter">🔍 Применить</button>
                </div>
                <div class="search-bar">
                    <input type="text" id="search-name" placeholder="Поиск по названию...">
                </div>
                <ul id="track-list" class="track-list"></ul>
            </div>

            <!-- Страница очереди -->
            <div class="page" id="page-queue">
                <h2>⏯️ Очередь</h2>
                <div class="queue-controls">
                    <button id="shuffle-queue">🔀 Перемешать</button>
                    <button id="clear-queue">🗑️ Очистить</button>
                    <button id="add-random">🎲 Добавить случайную</button>
                </div>
                <ul id="queue-list" class="queue-list"></ul>
            </div>

            <!-- Страница настроек -->
            <div class="page" id="page-settings">
                <h2>⚙️ Настройки</h2>
                <div class="settings-section">
                    <h3>Внешний вид</h3>
                    <div class="setting-item">
                        <label for="theme-select-settings">Тема:</label>
                        <select id="theme-select-settings">
                            <option value="light">☀️ Светлая</option>
                            <option value="dark">🌙 Тёмная</option>
                            <option value="dark2">🌙 Тёмная 2</option>
                            <option value="light-blue">💧 Светло-синяя</option>
                            <option value="dark-purple">🟣 Тёмно-фиолетовая</option>
                            <option value="green">🍃 Зелёная</option>
                            <option value="orange">🍊 Оранжевая</option>
                            <option value="monochrome">⚫ Монохромная</option>
                        </select>
                    </div>
                    <div class="setting-item">
                        <label for="custom-color-settings">Основной цвет:</label>
                        <input type="color" id="custom-color-settings" value="#4a90e2">
                    </div>
                </div>
                <div class="settings-section">
                    <h3>Управление данными</h3>
                    <div class="setting-item">
                        <button id="export-btn-settings">📤 Экспортировать данные</button>
                        <button id="import-btn-settings">📥 Импортировать данные</button>
                    </div>
                </div>
                <div class="settings-section">
                    <h3>Исключённые треки</h3>
                    <ul id="excluded-tracks-list" class="excluded-list"></ul>
                </div>
                <div class="settings-section">
                    <h3>Громкость по тегам</h3>
                    <div id="tag-volume-settings"></div>
                </div>
            </div>

            <!-- Страница детальной информации о треке -->
            <div class="page" id="page-track">
                <h2>🎵 Детали трека</h2>
                <div id="track-detail-container">
                    <!-- сюда будет подгружаться информация -->
                </div>
                <button id="back-to-library" class="back-btn">← Назад в библиотеку</button>
            </div>
        </main>

        <!-- Плеер (всегда видим) -->
        <footer class="player-bar">
            <div class="player-info">
                <span id="current-track-name">🎵 Не выбрано</span>
            </div>
            <div class="player-controls">
                <button id="play-pause">▶️</button>
                <button id="prev">⏮️</button>
                <button id="next">⏭️</button>
                <input type="range" id="progress" value="0" min="0" max="100" step="0.1">
                <input type="range" id="volume" value="80" min="0" max="100">
            </div>
        </footer>
    </div>

    <!-- Подключение скриптов -->
    <script src="js/modules/utils.js"></script>
    <script src="js/modules/db.js"></script>
    <script src="js/modules/fileHandler.js"></script>
    <script src="js/modules/player.js"></script>
    <script src="js/modules/themes.js"></script>
    <script src="js/modules/ui.js"></script>
    <script src="js/router.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
