<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Sortable для drag & drop очереди -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <!-- Библиотека для чтения метаданных (обложки) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
</head>
<body>
    <div id="app">
        <header>
            <div class="toolbar">
                <button id="select-music-btn">📂 Выбрать папку с музыкой</button>
                <nav class="main-nav">
                    <button class="nav-btn" data-page="library">📚 Библиотека</button>
                    <button class="nav-btn" data-page="queue">⏯️ Очередь</button>
                    <button class="nav-btn" data-page="playlists">📋 Плейлисты</button>
                    <button class="nav-btn" data-page="settings">⚙️ Настройки</button>
                </nav>
                <button id="import-btn">📥 Импорт</button>
                <button id="export-btn">📤 Экспорт</button>
                <select id="theme-select">
                    <option value="light">☀️ Светлая</option>
                    <option value="dark">🌙 Тёмная</option>
                    <option value="dark2">🌙 Тёмная 2</option>
                    <option value="light-blue">💧 Светло-синяя</option>
                    <option value="dark-purple">🟣 Тёмно-фиолетовая</option>
                    <option value="green">🍃 Зелёная</option>
                    <option value="orange">🍊 Оранжевая</option>
                    <option value="monochrome">⚫ Монохромная</option>
                    <option value="dracula">🧛 Дракула</option>
                    <option value="nord">❄️ Норд</option>
                    <option value="solarized">☀️ Solarized</option>
                </select>
            </div>
        </header>

        <main>
            <div class="page" id="page-library">
                <h2>📚 Библиотека</h2>
                <div class="filter-bar">
                    <input type="text" id="tag-filter" placeholder="Фильтр по тегам (рок, поп, ...)">
                </div>
                <div class="search-bar">
                    <input type="text" id="search-name" placeholder="Поиск по названию...">
                </div>
                <ul id="track-list" class="track-list"></ul>
            </div>

            <div class="page" id="page-queue">
                <h2>⏯️ Очередь</h2>
                <div class="queue-controls">
                    <button id="shuffle-queue">🔀 Перемешать</button>
                    <button id="clear-queue">🗑️ Очистить</button>
                    <button id="add-random">🎲 Добавить случайную</button>
                    <button id="add-random-10">🎲 +10 случайных</button>
                </div>
                <ul id="queue-list" class="queue-list"></ul>
            </div>

            <div class="page" id="page-playlists">
                <h2>📋 Плейлисты</h2>
                <div class="playlist-controls">
                    <button id="create-playlist" class="primary-btn">➕ Создать плейлист</button>
                </div>
                <div id="playlists-list" class="playlists-list"></div>
            </div>

            <div class="page" id="page-settings">
                <h2>⚙️ Настройки</h2>
                <div class="settings-section">
                    <h3>Внешний вид</h3>
                    <div class="setting-item">
                        <label for="theme-select-settings">Тема:</label>
                        <select id="theme-select-settings">
                            <option value="light">☀️ Светлая</option>
                            <option value="dark">🌙 Тёмная</option>
                            <option value="dark2">🌙 Тёмная 2</option>
                            <option value="light-blue">💧 Светло-синяя</option>
                            <option value="dark-purple">🟣 Тёмно-фиолетовая</option>
                            <option value="green">🍃 Зелёная</option>
                            <option value="orange">🍊 Оранжевая</option>
                            <option value="monochrome">⚫ Монохромная</option>
                            <option value="dracula">🧛 Дракула</option>
                            <option value="nord">❄️ Норд</option>
                            <option value="solarized">☀️ Solarized</option>
                        </select>
                    </div>
                    <div class="setting-item">
                        <label for="custom-color-settings">Основной цвет:</label>
                        <input type="color" id="custom-color-settings" value="#4a90e2">
                    </div>
                </div>

                <div class="settings-section">
                    <h3>Тонкая настройка темы</h3>
                    <div id="theme-fine-tuning"></div>
                    <button id="reset-theme-overrides">Сбросить к пресету</button>
                </div>

                <div class="settings-section">
                    <h3>Управление данными</h3>
                    <div class="setting-item">
                        <button id="export-btn-settings">📤 Экспортировать данные</button>
                        <button id="import-btn-settings">📥 Импортировать данные</button>
                    </div>
                </div>
                <div class="settings-section">
                    <h3>Исключённые треки</h3>
                    <ul id="excluded-tracks-list" class="excluded-list"></ul>
                </div>
                <!-- Удалён блок "Громкость по тегам" -->
            </div>

            <!-- Страница деталей трека с добавленными элементами управления -->
            <div class="page" id="page-track">
                <h2>🎵 Детали трека</h2>
                <div id="track-detail-container"></div>
                <!-- Блок управления, видимый только для текущего трека -->
                <div id="track-playback-controls" class="track-playback-controls hidden">
                    <div class="playback-progress">
                        <input type="range" id="track-progress" value="0" min="0" max="100" step="0.1">
                        <span id="track-time">0:00 / 0:00</span>
                    </div>
                    <div class="playback-volume">
                        <input type="range" id="track-volume" value="80" min="0" max="100">
                    </div>
                    <div class="playback-buttons">
                        <button id="track-prev">⏮️</button>
                        <button id="track-play-pause">▶️</button>
                        <button id="track-next">⏭️</button>
                    </div>
                </div>
                <button id="back-to-library" class="back-btn">← Назад в библиотеку</button>
            </div>
        </main>

        <footer class="player-bar" id="player-bar">
            <div class="player-cover">
                <img id="current-track-cover" src="" alt="cover">
                <canvas id="player-visualizer" width="50" height="50" style="display: none;"></canvas>
                <span class="no-cover">🎵</span>
            </div>
            <div class="player-info">
                <span id="current-track-name">🎵 Не выбрано</span>
            </div>
            <div class="player-controls">
                <button id="play-pause">▶️</button>
                <button id="prev">⏮️</button>
                <button id="next">⏭️</button>
                <input type="range" id="progress" value="0" min="0" max="100" step="0.1">
                <input type="range" id="volume" value="80" min="0" max="100">
            </div>
        </footer>
    </div>

    <script src="js/modules/utils.js"></script>
    <script src="js/modules/db.js"></script>
    <script src="js/modules/fileHandler.js"></script>
    <script src="js/modules/player.js"></script>
    <script src="js/modules/themes.js"></script>
    <script src="js/modules/ui.js"></script>
    <script src="js/modules/dragDrop.js"></script>
    <script src="js/router.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
