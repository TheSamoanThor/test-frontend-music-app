name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------- ФРОНТЕНД ----------
      - name: Build frontend package
        run: |
          rm -rf build_frontend
          mkdir -p build_frontend/js

          # Обязательные файлы фронтенда
          test -f index.html  || (echo "index.html not found" && exit 1)
          test -f styles.css  || (echo "styles.css not found" && exit 1)
          test -d js          || (echo "js/ not found" && exit 1)

          cp index.html build_frontend/
          cp styles.css build_frontend/
          cp -r js/. build_frontend/js/

          # README (если есть)
          [ -f README.md ] && cp README.md build_frontend/ || true

          # Чистка мусора
          find build_frontend -name ".DS_Store" -delete
          find build_frontend -name "*.gitkeep" -delete
          find build_frontend -name "*.log" -delete

          echo "=== FRONTEND CONTENT ==="
          find build_frontend -type f | sort

      # ---------- СЕРВЕР ----------
      - name: Build server package
        run: |
          rm -rf build_server
          mkdir -p build_server/music

          # Обязательные файлы сервера
          test -f server.py || (echo "server.py not found" && exit 1)
          test -f requirements.txt || (echo "requirements.txt not found" && exit 1)
          cp server.py build_server/
          cp requirements.txt build_server/

          # Скрипты запуска (копируем только если они физически существуют)
          [ -f start_server.bat ] && cp start_server.bat build_server/ || true
          [ -f start-server.sh ] && cp start-server.sh build_server/ || true
          [ -f reset_network.bat ] && cp reset_network.bat build_server/ || true
          [ -f create_zip.py ] && cp create_zip.py build_server/ || true
          [ -f create_zip.bat ] && cp create_zip.bat build_server/ || true

          # Пустая папка для музыки
          touch build_server/music/.gitkeep

          # README сервера
          cat > build_server/README-server.md <<'EOF'
          # Music Player — Server Bundle

          Этот архив содержит только серверную часть (FastAPI + SQLite).

          ## Запуск

          ### Windows
          1. Установите Python 3.10+ с https://python.org
          2. Запустите `start_server.bat`
          3. Откройте http://localhost:8000 или дождитесь автоматического открытия скриптом

          ### Linux / macOS
          ```bash
          chmod +x start-server.sh
          ./start-server.sh
          ```
          EOF

      # ---------- ПОЛНАЯ СБОРКА (FULL) ----------
      - name: Build full package
        run: |
          rm -rf build_full
          mkdir -p build_full

          # Копируем всё из фронтенда и сервера
          cp -r build_frontend/* build_full/
          cp -r build_server/* build_full/

          # Удаляем README сервера, заменим общим
          rm -f build_full/README-server.md

          # Создаем README для полной сборки
          cat > build_full/README-full.md <<'EOF'
          # Music Player — Full Bundle

          Этот архив содержит как клиентскую (фронтенд), так и серверную часть.

          ## Как запустить проект целиком:
          1. Для использования локального сервера перейдите в папку и запустите сервер:
             - Windows: `start_server.bat`
             - Linux / macOS: `chmod +x start-server.sh && ./start-server.sh`
          2. Откройте `index.html` в браузере или перейдите по адресу http://localhost:8000
          EOF

      # ---------- УПАКОВКА В ZIP ----------
      - name: Create ZIP archives
        run: |
          zip -r "music-player-frontend-${{ github.ref_name }}.zip" build_frontend
          zip -r "music-player-server-${{ github.ref_name }}.zip" build_server
          zip -r "music-player-full-${{ github.ref_name }}.zip" build_full

      # ---------- ПУБЛИКАЦИЯ РЕЛИЗА ----------
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            music-player-frontend-${{ github.ref_name }}.zip
            music-player-server-${{ github.ref_name }}.zip
            music-player-full-${{ github.ref_name }}.zip