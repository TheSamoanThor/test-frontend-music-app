name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare archive name
        id: vars
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "archive_name=music-player-${TAG}.zip" >> $GITHUB_OUTPUT

      - name: Create clean release folder
        run: |
          rm -rf release_dist
          mkdir -p release_dist/js
          cp index.html release_dist/
          cp styles.css release_dist/
          if [ -d "js" ] && [ "$(ls -A js)" ]; then
            cp -r js/* release_dist/js/
          fi
          # Удаляем лишние файлы
          find release_dist -name ".DS_Store" -delete
          find release_dist -name "*.gitkeep" -delete
          find release_dist -name "*.md" -delete
          find release_dist -name "LICENSE" -delete
          echo "Contents of release_dist:"
          ls -la release_dist/
          echo "Contents of release_dist/js:"
          ls -la release_dist/js/

      - name: Create archive from release folder
        run: |
          cd release_dist
          zip -r ../${{ steps.vars.outputs.archive_name }} .
          echo "Archive created. Listing archive contents:"
          unzip -l ../${{ steps.vars.outputs.archive_name }}

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.vars.outputs.archive_name }}
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}