name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare archive name
        id: vars
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "archive_name=music-player-${TAG}.zip" >> $GITHUB_OUTPUT

      - name: Create clean release folder
        run: |
          # 1. Удаляем папку, если она была, и создаем заново
          rm -rf release_dist
          mkdir -p release_dist/js
          
          # 2. Копируем ТОЛЬКО нужные файлы (явно)
          cp index.html release_dist/
          cp styles.css release_dist/
          
          # 3. Копируем содержимое js, проверяя наличие файлов
          if [ -d "js" ] && [ "$(ls -A js)" ]; then
            cp -r js/* release_dist/js/
          fi

      - name: Create archive from release folder
        run: |
          # Заходим в изолированную папку и пакуем всё, что в ней есть
          cd release_dist
          zip -r ../${{ steps.vars.outputs.archive_name }} .

      - name: List files for debug
        run: unzip -l ${{ steps.vars.outputs.archive_name }}

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.vars.outputs.archive_name }}
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}