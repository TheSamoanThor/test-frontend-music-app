name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare archive name
        id: vars
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "archive_name=music-player-${TAG}.zip" >> $GITHUB_OUTPUT

      - name: Create release folder
        run: |
          mkdir release
          cp index.html release/
          cp styles.css release/
          cp -r js release/

      - name: Create archive
        run: |
          cd release
          zip -r ../${{ steps.vars.outputs.archive_name }} .

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.vars.outputs.archive_name }}
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}